<!DOCTYPE HTML>
<html>
  <head>
    <title>Flight Computer Visualization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <!-- Use your own style.css if needed or inline styles below -->
    <style>
      body { font-family: Arial, sans-serif; background: #f1f1f1; margin: 0; padding: 0; }
      .topnav { background: #003366; padding: 10px; color: #fff; text-align: center; }
      .content { padding: 20px; }
      .cards { display: flex; flex-wrap: wrap; justify-content: space-around; }
      .card { background: #ffffff; padding: 20px; margin: 10px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
      .card-title { font-size: 20px; margin-bottom: 10px; }
      .reading { font-size: 18px; }
      .cube-content { text-align: center; }
      #3Dcube { width: 100%; height: 400px; background: #ddd; }
      button { background: #003366; color: #fff; border: none; padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; border-radius: 4px; }
      button:hover { background: #0055AA; }
    </style>
  </head>
  <body>
    <div class="topnav">
      <h1><i class="fas fa-compass"></i> MPU6050 Visualization</h1>
    </div>
    <div class="content">
      <div class="cards">
        <div class="card">
          <p class="card-title">GYROSCOPE</p>
          <p><span class="reading">X: <span id="gyroX"></span> rad</span></p>
          <p><span class="reading">Y: <span id="gyroY"></span> rad</span></p>
          <p><span class="reading">Z: <span id="gyroZ"></span> rad</span></p>
        </div>
        <div class="card">
          <p class="card-title">ACCELEROMETER</p>
          <p><span class="reading">X: <span id="accX"></span> m/s²</span></p>
          <p><span class="reading">Y: <span id="accY"></span> m/s²</span></p>
          <p><span class="reading">Z: <span id="accZ"></span> m/s²</span></p>
        </div>
        <div class="card">
          <p class="card-title">TEMPERATURE</p>
          <p><span class="reading"><span id="temp"></span> °C</span></p>
          <p class="card-title">3D ANIMATION</p>
          <button id="reset" onclick="resetPosition(this)">RESET POSITION</button>
          <button id="resetX" onclick="resetPosition(this)">X</button>
          <button id="resetY" onclick="resetPosition(this)">Y</button>
          <button id="resetZ" onclick="resetPosition(this)">Z</button>
        </div>
      </div>
      <div class="cube-content">
        <div id="3Dcube"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
