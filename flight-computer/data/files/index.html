<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>File Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>File Manager</h1>

  <!-- Optional status banner used by script.js's flash() helper -->
  <div id="flash" class="flash"></div>

  <!-- Upload -->
  <h2>Upload New Files</h2>
  <div class="centered-upload-btn">
    <a href="/spiffsupload">
      <button class="upload-btn" type="button">SPIFFS bestanden uploaden</button>
    </a>
  </div>

    <div style="text-align:center; margin-top:24px;">
    <a href="/"><button type="button">Back</button></a>
  </div>
  
  <!-- File lists -->
  <div id="file-lists">
    <h2>SD Card Files</h2>

    <!-- Big danger button (single button, no nesting, no inline onclick) -->
<div class="danger-area">
  <button id="btn-delete-all-sd" type="button">Delete ALL files on SD</button>
</div>

    <ul id="sd-list"></ul>

    <h2>SPIFFS Files</h2>
    <ul id="spiffs-list"></ul>
  </div>



  <script src="script.js"></script>
</body>
</html>
